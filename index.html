  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #F4F6FA;
      color: #1B1F3B;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Botones y tarjetas táctiles 3D estilo Duolingo */
    .tactile-card {
      border: 2px solid #E5E7EB;
      border-bottom-width: 5px;
      transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .tactile-card:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .tactile-btn {
      border-bottom-width: 4px;
      transition: transform 0.1s ease, filter 0.15s ease, background-color 0.15s ease;
    }
    .tactile-btn:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    /* Nodo circular del camino */
    .path-node {
      border-bottom-width: 6px;
      transition: transform 0.12s ease, box-shadow 0.2s ease;
    }
    .path-node:active:not(:disabled) {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    /* Animación flotante para etiqueta EMPEZAR */
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatBounce 1.8s ease-in-out infinite;
    }

    /* Anillo pulsante suave en nodo activo */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.22); opacity: 0; }
      100% { transform: scale(1.22); opacity: 0; }
    }
    .pulse-ring {
      animation: pulseRing 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    /* Animación de entrada de pantalla */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .screen-enter {
      animation: fadeSlideIn 0.22s ease-out forwards;
    }

    /* Animación de panel inferior de feedback */
    @keyframes slideUpPanel {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .feedback-enter {
      animation: slideUpPanel 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Scrollbar limpio dentro del contenedor móvil */
    .app-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .app-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .app-scroll::-webkit-scrollbar-thumb {
      background: #E2E8F0;
      border-radius: 9999px;
    }

    // =========================================================================
    // 1. SINTETIZADOR DE SONIDO SUAVE (WEB AUDIO API)
    // =========================================================================
    const SoundFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, gainVal = 0.12) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) { /* Silencioso si el navegador bloquea audio sin gesto */ }
      },
      tap() {
        this.playTone(520, 'sine', 0.06, 0, 0.06);
      },
      correct() {
        // Acorde ascendente limpio estilo Duolingo (C5 -> E5 -> G5)
        this.playTone(523.25, 'triangle', 0.14, 0, 0.13);
        this.playTone(659.25, 'triangle', 0.14, 0.07, 0.13);
        this.playTone(783.99, 'triangle', 0.24, 0.14, 0.14);
      },
      wrong() {
        // Dos notas descendentes suaves, amigables y no estridentes
        this.playTone(330, 'sine', 0.16, 0, 0.11);
        this.playTone(261.63, 'sine', 0.24, 0.12, 0.11);
      },
      complete() {
        // Fanfarria corta de celebración
        this.playTone(523.25, 'triangle', 0.14, 0, 0.14);
        this.playTone(659.25, 'triangle', 0.14, 0.09, 0.14);
        this.playTone(783.99, 'triangle', 0.14, 0.18, 0.14);
        this.playTone(1046.50, 'triangle', 0.36, 0.27, 0.16);
      }
    };

    const STORAGE_KEY = 'kairos_jc_prototype_v1';

    let state = {
      screen: 'onboarding', // 'onboarding' | 'path' | 'lesson' | 'summary'
      selectedCourse: 'tradear', // 'invertir' | 'tradear' (tradear preseleccionado como en el boceto)
      xp: 40,
      streak: 5, // "5 días" como en el boceto
      testerUnlockAll: false,
      completedLessons: {
        invertir: [],
        tradear: []
      },
      // Estado de lección activa
      activeLesson: null, // { courseId, lessonIndex }
      questionQueue: [],
      currentQIndex: 0,
      totalInitialQuestions: 3,
      firstTryCorrectCount: 0,
      wrongOnceSet: new Set(),
      selectedOption: null,
      answerState: 'idle', // 'idle' | 'correct' | 'wrong'
      lastEarnedXP: 0,
      previousRank: 7,
      // Estado del modal de feedback
      feedbackRating: 5,
      feedbackCourse: 'Ambos'
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.selectedCourse = parsed.selectedCourse || 'tradear';
          state.xp = typeof parsed.xp === 'number' ? parsed.xp : 40;
          state.streak = typeof parsed.streak === 'number' ? parsed.streak : 5;
          state.testerUnlockAll = !!parsed.testerUnlockAll;
          if (parsed.completedLessons) {
            state.completedLessons = {
              invertir: Array.isArray(parsed.completedLessons.invertir) ? parsed.completedLessons.invertir : [],
              tradear: Array.isArray(parsed.completedLessons.tradear) ? parsed.completedLessons.tradear : []
            };
          }
        }
      } catch (e) { /* Ignorar si localStorage no está disponible */ }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          selectedCourse: state.selectedCourse,
          xp: state.xp,
          streak: state.streak,
          testerUnlockAll: state.testerUnlockAll,
          completedLessons: state.completedLessons
        }));
      } catch (e) { /* Ignorar */ }
    }

    // Cálculo dinámico del puesto en la Liga Sabas Nieves (empieza en puesto 7 de 30 como en el boceto)
    function getLeagueRank(xp) {
      if (xp >= 280) return 1;
      if (xp >= 220) return 2;
      if (xp >= 170) return 3;
      if (xp >= 130) return 4;
      if (xp >= 95) return 5;
      if (xp >= 65) return 6;
      return 7; // Puesto inicial exacto del boceto
    }

      } else if (state.screen === 'path') {

    function updateTopTesterBar() {
      const dot = document.getElementById('tester-dot');
      const statusText = document.getElementById('tester-status-text');
      const soundIcon = document.getElementById('sound-icon');

      if (state.testerUnlockAll) {
        dot.className = 'w-2 h-2 rounded-full bg-invest animate-pulse';

        statusText.className = 'text-invest-dark';

        dot.className = 'w-2 h-2 rounded-full bg-gray-300';
        statusText.textContent = 'Normal';
        statusText.className = 'text-ink';
      }

      soundIcon.textContent = SoundFX.enabled ? '🔊' : '🔇';
    }

    // -------------------------------------------------------------------------
    // PANTALLA 2 · TU CAMINO (Ruta de aprendizaje estilo Duolingo)
    // -------------------------------------------------------------------------
    function renderPathScreen() {
      const course = COURSES[state.selectedCourse];
      const completed = state.completedLessons[course.id] || [];
      const isInvest = course.id === 'invertir';

      const headerBg = isInvest ? 'bg-invest border-invest-dark' : 'bg-trade border-trade-dark';
      const activeNodeBg = isInvest ? 'bg-invest border-invest-dark text-white' : 'bg-trade border-trade-dark text-white';
      const activeRingColor = isInvest ? 'border-invest' : 'border-trade';
      const badgeTextColor = isInvest ? 'text-invest-dark' : 'text-trade-dark';
      const rank = getLeagueRank(state.xp);

      // Determinar cuál es la siguiente lección desbloqueada en modo normal
      let nextLessonIdx = course.lessons.findIndex(l => !completed.includes(l.id));
      if (nextLessonIdx === -1) nextLessonIdx = course.lessons.length; // Todas completadas

      // Offsets horizontales en zigzag suave (en px)
      const zigzagOffsets = [0, -46, -68, -36, 18, 58, 66, 32, -24, 0];

      const nodesHTML = course.lessons.map((lesson, idx) => {
        const isDone = completed.includes(lesson.id);
        const isCurrent = !isDone && idx === nextLessonIdx;
        const isUnlocked = state.testerUnlockAll || isDone || isCurrent;
        const offsetX = zigzagOffsets[idx % zigzagOffsets.length];

        let nodeStyle = '';
        let iconContent = '';

        if (isDone) {
          // Lección completada en dorado #FFC933
          nodeStyle = 'bg-prize border-prize-dark text-ink';
          iconContent = `
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B1F3B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          `;
        } else if (isCurrent) {
          // Lección actual en color del curso
          nodeStyle = activeNodeBg;
          iconContent = `<span class="text-2xl">${lesson.icon}</span>`;
        } else if (state.testerUnlockAll) {
          // Desbloqueada por Modo Tester
          nodeStyle = 'bg-white border-gray-300 text-ink hover:border-gray-400';
          iconContent = `<span class="text-xl">${lesson.icon}</span>`;
        } else {
          // Bloqueada en gris claro
          nodeStyle = 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed';
          iconContent = `
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          `;
        }

        return `
          <div class="relative flex flex-col items-center my-3.5" style="transform: translateX(${offsetX}px);">
            ${isCurrent ? `
              <div class="animate-float mb-2 px-3 py-1 rounded-xl bg-white border-2 border-gray-200 shadow-xs text-[11px] font-display font-black tracking-wider ${badgeTextColor}">
                EMPEZAR
              </div>
            ` : ''}

            <div class="relative flex items-center justify-center">
              ${isCurrent ? `<span class="pulse-ring absolute inset-0 rounded-full border-4 ${activeRingColor}"></span>` : ''}
              <button type="button"
                ${isUnlocked ? `onclick="startLesson('${course.id}', ${idx})"` : 'disabled'}
                aria-label="Lección ${idx + 1}: ${lesson.title}"
                class="path-node relative w-[70px] h-[70px] rounded-full flex items-center justify-center font-display font-extrabold shadow-xs ${nodeStyle}">
                ${iconContent}
                <span class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-white border-2 border-gray-200 text-[11px] font-extrabold text-ink flex items-center justify-center">
                  ${idx + 1}
                </span>
              </button>
            </div>

            <!-- Título de la lección -->
            <div class="mt-2 text-center max-w-[165px]">
              <p class="font-display font-extrabold text-xs leading-snug ${isUnlocked ? 'text-ink' : 'text-gray-400'}">
                ${lesson.title}
              </p>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="flex-1 flex flex-col h-full overflow-hidden screen-enter">
          <!-- Barra superior de estado (Curso, XP dorados, Racha) -->
          <header class="px-4 py-3 border-b-2 border-gray-100 bg-white flex items-center justify-between gap-2 shrink-0">
            <!-- Selector / Cambio de curso -->
            <button type="button" onclick="goToOnboarding()" title="Cambiar de curso"
              class="flex items-center gap-2 px-3 py-1.5 rounded-2xl border-2 border-gray-200 hover:bg-gray-50 transition">
              <span class="w-3.5 h-3.5 rounded-full ${isInvest ? 'bg-invest' : 'bg-trade'}"></span>
              <span class="font-display font-extrabold text-sm text-ink">${course.name}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>

            <!-- XP y Racha -->
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-1 bg-prize-soft px-2.5 py-1 rounded-xl border border-prize/60">
                <span class="text-sm">⭐</span>
                <span class="font-display font-extrabold text-sm text-ink">${state.xp} XP</span>
              </div>
              <div class="flex items-center gap-1 bg-orange-50 px-2.5 py-1 rounded-xl border border-orange-200/70">
                <span class="text-sm">🔥</span>

              </div>
            </div>
          </header>

          <!-- Contenido desplazable del camino -->
          <div class="flex-1 overflow-y-auto app-scroll px-4 pt-4 pb-24">
            <!-- Tarjeta de cabecera de Unidad -->
            <div class="${headerBg} border-b-4 rounded-3xl p-4 text-white shadow-xs mb-5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-extrabold uppercase tracking-wider opacity-90">
                  Ruta · ${completed.length}/10 completadas
                </span>
                <button type="button" onclick="quickSwitchCourse()"
                  class="text-[11px] font-extrabold bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl transition">
                  Ir a ${isInvest ? 'Tradear 🕯️' : 'Invertir 🌱'}
                </button>
              </div>
              <h2 class="font-display font-extrabold text-lg mt-1 leading-snug">
                ${course.unitTitle}
              </h2>
              <p class="text-xs text-white/90 mt-0.5">
                ${course.unitDesc}
              </p>
            </div>

            <!-- Camino vertical en zigzag con línea conectora central sutil -->
            <div class="relative flex flex-col items-center py-2">
              <div class="absolute top-8 bottom-8 w-1.5 bg-gray-100 rounded-full -z-0"></div>
              <div class="relative z-10 flex flex-col items-center w-full">
                ${nodesHTML}
              </div>
            </div>
          </div>

          <!-- Tarjeta fija inferior de Liga Sabas Nieves (Boceto Pantalla 2) -->
          <div class="px-4 py-3 bg-white border-t-2 border-gray-100 shrink-0">
            <div class="bg-prize-soft/75 border-2 border-prize/70 rounded-2xl px-4 py-2.5 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="text-xl">🏆</span>
                <div>
                  <p class="font-display font-extrabold text-xs text-ink">
                    Liga Sabas Nieves · puesto ${rank} de 30

    }

    // -------------------------------------------------------------------------
    // PANTALLA 3 · LECCIÓN INTERACTIVA (Fiel al boceto 3)
    // -------------------------------------------------------------------------
    function renderLessonScreen() {
      const { courseId, lessonIndex } = state.activeLesson;
      const course = COURSES[courseId];
      const lesson = course.lessons[lessonIndex];
      const isInvest = courseId === 'invertir';

      const currentItem = state.questionQueue[state.currentQIndex];
      // Progreso basado en cuántas preguntas iniciales ya se respondieron bien
      const remaining = state.questionQueue.length - state.currentQIndex;
      const doneFraction = Math.max(0.08, Math.min(1, (state.totalInitialQuestions - remaining + (state.answerState === 'correct' ? 1 : 0)) / state.totalInitialQuestions));
      const progressPct = Math.round(doneFraction * 100);

      const barColor = isInvest ? 'bg-invest' : 'bg-trade';
      const selectedBorder = isInvest ? 'border-invest bg-invest-soft/45' : 'border-trade bg-trade-soft/50';
      const checkBtnColor = isInvest ? 'bg-invest border-invest-dark' : 'bg-trade border-trade-dark';

      const letters = ['A', 'B', 'C'];

      const optionsHTML = currentItem.shuffledOptions.map((optText, i) => {
        const isSelected = state.selectedOption === optText;
        let cardClass = 'bg-white border-gray-200 hover:border-gray-300 text-ink';
        let letterBadgeClass = 'bg-gray-100 text-gray-500';

        if (state.answerState === 'idle') {
          if (isSelected) {
            cardClass = `${selectedBorder} text-ink`;
            letterBadgeClass = isInvest ? 'bg-invest text-white' : 'bg-trade text-white';
          }
        } else if (state.answerState === 'correct') {
          if (optText === currentItem.correct) {
            cardClass = 'bg-invest-soft border-invest text-ink';
            letterBadgeClass = 'bg-invest text-white';
          } else {
            cardClass = 'bg-white border-gray-200 opacity-55 text-gray-500';
          }
        } else if (state.answerState === 'wrong') {
          if (isSelected) {
            cardClass = 'bg-[#FFF5F5] border-[#FF6B6B] text-ink';
            letterBadgeClass = 'bg-[#FF6B6B] text-white';
          } else if (optText === currentItem.correct) {
            cardClass = 'bg-invest-soft/70 border-invest text-ink';
            letterBadgeClass = 'bg-invest text-white';
          } else {
            cardClass = 'bg-white border-gray-200 opacity-55 text-gray-500';
          }
        }

        return `
          <button type="button"
            ${state.answerState !== 'idle' ? 'disabled' : `onclick="chooseOption(${i})"`}
            class="tactile-card w-full p-3.5 rounded-2xl text-left flex items-center gap-3 ${cardClass}">
            <span class="w-7 h-7 rounded-lg font-display font-extrabold text-xs flex items-center justify-center shrink-0 ${letterBadgeClass}">
              ${letters[i] || i + 1}
            </span>
            <span class="font-semibold text-[14.5px] leading-snug flex-1">
              ${optText}
            </span>
          </button>
        `;
      }).join('');

      // Panel inferior: Botón "Comprobar" o Retroalimentación inmediata (idéntico al boceto)
      let bottomPanelHTML = '';
      if (state.answerState === 'idle') {
        const hasChoice = state.selectedOption !== null;
        bottomPanelHTML = `
          <div class="p-4 bg-white border-t-2 border-gray-100 shrink-0">
            <button type="button"
              ${hasChoice ? 'onclick="checkAnswer()"' : 'disabled'}
              class="tactile-btn w-full py-3.5 rounded-2xl font-display font-extrabold text-base tracking-wide ${hasChoice ? `${checkBtnColor} text-white` : 'bg-gray-200 border-gray-300 text-gray-400 cursor-not-allowed'}">
              Comprobar
            </button>
          </div>
        `;
      } else if (state.answerState === 'correct') {
        bottomPanelHTML = `
          <div class="feedback-enter p-5 bg-invest-soft border-t-2 border-invest-border shrink-0">
            <div class="flex items-start gap-3 mb-3.5">
              <div class="w-8 h-8 rounded-full bg-invest text-white flex items-center justify-center shrink-0 mt-0.5">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
              <div>
                <h4 class="font-display font-black text-lg text-invest leading-tight">
                  ¡Exacto! +10 XP
                </h4>
                <p class="text-xs font-semibold text-ink/80 mt-1 leading-relaxed">
                  ${currentItem.explain}
                </p>
              </div>
            </div>
            <button type="button" onclick="nextQuestion()"
              class="tactile-btn w-full py-3.5 rounded-2xl font-display font-extrabold text-base text-white bg-invest border-invest-dark">
              Continuar
            </button>
          </div>
        `;
      } else {
        bottomPanelHTML = `
          <div class="feedback-enter p-5 bg-[#FFF5F5] border-t-2 border-[#FFC9C9] shrink-0">
            <div class="flex items-start gap-3 mb-3.5">
              <div class="w-8 h-8 rounded-full bg-[#FF6B6B] text-white flex items-center justify-center shrink-0 font-display font-black text-base mt-0.5">
                !
              </div>
              <div>
                <h4 class="font-display font-black text-base text-[#E03131] leading-tight">
                  ¡Casi! Mira por qué:
                </h4>
                <p class="text-xs font-semibold text-ink/85 mt-1 leading-relaxed">
                  ${currentItem.explain}
                </p>
              </div>
            </div>
            <button type="button" onclick="nextQuestion()"
              class="tactile-btn w-full py-3.5 rounded-2xl font-display font-extrabold text-base text-white bg-[#FF6B6B] border-[#E03131]">
              Continuar
            </button>
          </div>
        `;
      }

      return `
        <div class="flex-1 flex flex-col h-full overflow-hidden screen-enter bg-white">
          <!-- Barra superior: Botón × y barra de progreso horizontal -->
          <div class="px-4 pt-4 pb-2 flex items-center gap-3 shrink-0">
            <button type="button" onclick="requestExitLesson()" aria-label="Salir de la lección"
              class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-ink text-2xl font-bold transition">
              ×
            </button>
            <div class="flex-1 h-3.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full ${barColor} rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
            <span class="text-xs font-display font-extrabold text-gray-400">
              ${Math.min(state.currentQIndex + 1, state.questionQueue.length)}/${state.questionQueue.length}
            </span>
          </div>

          <!-- Área central de la pregunta -->
          <div class="flex-1 overflow-y-auto app-scroll px-5 py-2 flex flex-col justify-between">
            <div>
              <div class="inline-flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-lg ${isInvest ? 'bg-invest-soft text-invest-dark' : 'bg-trade-soft text-trade-dark'} mb-2.5">
                <span>${lesson.icon}</span>
                <span>Lección ${lessonIndex + 1} · ${lesson.title}</span>
              </div>

              <h2 class="font-display font-extrabold text-[20px] leading-snug text-ink">
                ${currentItem.q}
              </h2>

              <!-- Ilustración SVG didáctica cuando la pregunta lo requiere -->
              ${getDiagramSVG(currentItem.diagram)}
            </div>

            <!-- Tarjetas de opciones -->
            <div class="flex flex-col gap-2.5 my-3">
              ${optionsHTML}
            </div>
          </div>

          <!-- Panel inferior fijo -->
          ${bottomPanelHTML}
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // PANTALLA 4 · RESUMEN AL COMPLETAR LECCIÓN
    // -------------------------------------------------------------------------
    function renderSummaryScreen() {
      const { courseId, lessonIndex } = state.activeLesson;
      const course = COURSES[courseId];
      const lesson = course.lessons[lessonIndex];
      const isInvest = courseId === 'invertir';
      const btnBg = isInvest ? 'bg-invest border-invest-dark' : 'bg-trade border-trade-dark';

      const accuracy = Math.round((state.firstTryCorrectCount / state.totalInitialQuestions) * 100);
      const newRank = getLeagueRank(state.xp);
      const rankImproved = newRank < state.previousRank;

      return `
        <div class="flex-1 flex flex-col justify-between px-6 py-8 text-center screen-enter overflow-y-auto app-scroll">
          <div class="flex flex-col items-center pt-4">
            <!-- Medalla dorada #FFC933 -->
            <div class="w-24 h-24 rounded-3xl bg-prize-soft border-b-4 border-prize flex items-center justify-center text-5xl shadow-xs mb-4">
              🏆
            </div>
            <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full ${isInvest ? 'bg-invest-soft text-invest-dark' : 'bg-trade-soft text-trade-dark'}">
              Lección ${lessonIndex + 1} completada
            </span>
            <h2 class="font-display font-black text-[26px] text-ink mt-2 leading-tight">
              ¡Excelente trabajo!
            </h2>
            <p class="text-sm text-gray-500 mt-1">
              Dominaste <strong class="text-ink">${lesson.title}</strong>
            </p>
          </div>

          <!-- Métricas de logro (XP, Racha, Precisión) -->
          <div class="grid grid-cols-3 gap-2.5 my-6">
            <div class="bg-prize-soft/70 border-2 border-prize rounded-2xl p-3">
              <span class="text-[11px] font-extrabold uppercase text-amber-700 block">Ganado</span>
              <span class="font-display font-black text-lg text-ink mt-1 block">+${state.lastEarnedXP} XP</span>
            </div>
            <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-3">
              <span class="text-[11px] font-extrabold uppercase text-trade-dark block">Racha</span>
              <span class="font-display font-black text-lg text-ink mt-1 block">🔥 ${state.streak}d</span>
            </div>
            <div class="bg-invest-soft border-2 border-invest-border rounded-2xl p-3">
              <span class="text-[11px] font-extrabold uppercase text-invest-dark block">Precisión</span>
              <span class="font-display font-black text-lg text-ink mt-1 block">${accuracy}%</span>
            </div>
          </div>

          <!-- Notificación de Liga Sabas Nieves -->
          <div class="bg-gray-50 border-2 border-gray-100 rounded-2xl p-4 mb-6">
            <p class="font-display font-extrabold text-sm text-ink">
              🏆 Liga Sabas Nieves · Puesto ${newRank} de 30
            </p>
            <p class="text-xs text-gray-500 mt-1">
              ${rankImproved
                ? `¡Subiste del puesto #${state.previousRank} al #${newRank} con tus nuevos XP!`
                : 'Sigue sumando XP para escalar al podio de tu liga.'}
            </p>
          </div>

          <button type="button" onclick="returnToPath()"
            class="tactile-btn w-full py-4 rounded-2xl font-display font-extrabold text-lg text-white ${btnBg}">
            Volver al camino
          </button>
        </div>
      `;
    }

    // =========================================================================
    // 7. CONTROLADORES DE INTERACCIÓN Y LÓGICA DEL JUEGO
    // =========================================================================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function selectCourse(courseId) {
      SoundFX.tap();
      state.selectedCourse = courseId;
      saveState();
      render();
    }

    function startSelectedCourse() {
      SoundFX.tap();
      state.screen = 'path';
      saveState();
      render();
    }

    function goToOnboarding() {
      SoundFX.tap();
      state.screen = 'onboarding';
      render();
    }

    function quickSwitchCourse() {
      SoundFX.tap();
      state.selectedCourse = state.selectedCourse === 'invertir' ? 'tradear' : 'invertir';
      saveState();
      render();
    }

    function startLesson(courseId, lessonIndex) {
      SoundFX.tap();
      const course = COURSES[courseId];
      const lesson = course.lessons[lessonIndex];

      // Preparar cola de 3 preguntas con opciones mezcladas
      const queue = lesson.questions.map((item, idx) => ({
        ...item,
        uid: `${lesson.id}-q${idx}`,
        shuffledOptions: shuffleArray(item.options)
      }));

      state.activeLesson = { courseId, lessonIndex };
      state.questionQueue = queue;
      state.currentQIndex = 0;
      state.totalInitialQuestions = queue.length;
      state.firstTryCorrectCount = 0;
      state.wrongOnceSet = new Set();
      state.selectedOption = null;
      state.answerState = 'idle';
      state.previousRank = getLeagueRank(state.xp);
      state.screen = 'lesson';
      render();
    }

    function chooseOption(shuffledIdx) {
      if (state.answerState !== 'idle') return;
      SoundFX.tap();
      const currentItem = state.questionQueue[state.currentQIndex];
      state.selectedOption = currentItem.shuffledOptions[shuffledIdx];
      render();
    }

    function checkAnswer() {
      if (!state.selectedOption || state.answerState !== 'idle') return;
      const currentItem = state.questionQueue[state.currentQIndex];
      const isCorrect = state.selectedOption === currentItem.correct;

      if (isCorrect) {
        SoundFX.correct();
        state.answerState = 'correct';
        if (!state.wrongOnceSet.has(currentItem.uid)) {
          state.firstTryCorrectCount += 1;
        }
      } else {
        SoundFX.wrong();
        state.answerState = 'wrong';
        state.wrongOnceSet.add(currentItem.uid);
        // Re-encolar al final de la lección para reforzar el aprendizaje
        state.questionQueue.push({
          ...currentItem,
          shuffledOptions: shuffleArray(currentItem.options)
        });
      }
      render();
    }

    function nextQuestion() {
      SoundFX.tap();
      if (state.currentQIndex + 1 < state.questionQueue.length) {
        state.currentQIndex += 1;
        state.selectedOption = null;
        state.answerState = 'idle';
        render();
      } else {
        completeCurrentLesson();
      }
    }

    function completeCurrentLesson() {
      SoundFX.complete();
      const { courseId, lessonIndex } = state.activeLesson;
      const lesson = COURSES[courseId].lessons[lessonIndex];

      // +30 XP por lección completada (10 XP por cada pregunta dominada)
      const earned = 30;
      state.lastEarnedXP = earned;
      state.xp += earned;

      if (!state.completedLessons[courseId].includes(lesson.id)) {
        state.completedLessons[courseId].push(lesson.id);
        // Incrementar racha si es la primera lección nueva completada
        if (state.streak === 5) state.streak = 6;
      }

      saveState();
      state.screen = 'summary';
      render();
    }

    function returnToPath() {
      SoundFX.tap();
      state.screen = 'path';
      render();
    }

    // Modal de salida de lección
    function requestExitLesson() {
      SoundFX.tap();
      const modal = document.getElementById('exit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeExitModal() {
      SoundFX.tap();
      const modal = document.getElementById('exit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmExitLesson() {
      closeExitModal();
      state.screen = 'path';
      render();
    }

    // Controles de la barra superior de Testers
    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      if (SoundFX.enabled) SoundFX.tap();
      updateTopTesterBar();
      showToast(SoundFX.enabled ? '🔊' : '🔇', SoundFX.enabled ? 'Sonidos activados' : 'Sonidos silenciados');
    }

    function toggleTesterUnlock() {
      SoundFX.tap();
      state.testerUnlockAll = !state.testerUnlockAll;
      saveState();
      render();
      showToast(
        state.testerUnlockAll ? '🔓' : '🔒',
        state.testerUnlockAll ? 'Modo Tester: Todas las lecciones desbloqueadas' : 'Modo normal secuencial activado'
      );
    }

    // =========================================================================
    // 8. MODAL DE FEEDBACK PARA TESTERS (EXPORTABLE A WHATSAPP)
    // =========================================================================
    function openFeedbackModal() {
      SoundFX.tap();
      const modal = document.getElementById('feedback-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      updateFeedbackPreview();
    }

    function closeFeedbackModal() {
      SoundFX.tap();
      const modal = document.getElementById('feedback-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setFeedbackRating(rate) {
      SoundFX.tap();
      state.feedbackRating = rate;
      document.querySelectorAll('.rate-btn').forEach(btn => {
        const val = Number(btn.dataset.rate);
        if (val === rate) {
          btn.classList.add('bg-prize-soft', 'border-prize');
          btn.classList.remove('bg-white');
        } else {
          btn.classList.remove('bg-prize-soft', 'border-prize');
          btn.classList.add('bg-white');
        }
      });
      updateFeedbackPreview();
    }

    function setFeedbackCourse(courseName) {
      SoundFX.tap();
      state.feedbackCourse = courseName;
      document.querySelectorAll('.fcourse-btn').forEach(btn => {
        if (btn.dataset.fcourse === courseName) {
          btn.classList.add('bg-invest-soft', 'border-invest');
          btn.classList.remove('bg-white');
        } else {
          btn.classList.remove('bg-invest-soft', 'border-invest');
          btn.classList.add('bg-white');
        }
      });
      updateFeedbackPreview();
    }

    function buildFeedbackSummaryText() {
      const commentEl = document.getElementById('feedback-comment');
      const comment = commentEl ? commentEl.value.trim() : '';
      const totalDone = state.completedLessons.invertir.length + state.completedLessons.tradear.length;
      return `🧪 *Feedback Kairos JC*\n` +
        `⭐ Interfaz y experiencia: ${state.feedbackRating}/5\n` +
        `📚 Curso favorito: ${state.feedbackCourse}\n` +
        `🎯 Progreso en prueba: ${totalDone} lecciones (${state.xp} XP)\n` +
        `💬 Comentario: ${comment || '¡Muy intuitiva y fácil de entender!'}`;
    }

    function updateFeedbackPreview() {
      const previewEl = document.getElementById('feedback-preview');
      if (previewEl) {
        previewEl.textContent = buildFeedbackSummaryText();
      }
    }

    function copyFeedbackForWhatsApp() {
      SoundFX.correct();
      const text = buildFeedbackSummaryText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('📋', '¡Opinión copiada! Listo para pegar en WhatsApp');
          closeFeedbackModal();
        }).catch(() => fallbackCopyText(text));
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        showToast('📋', '¡Opinión copiada! Listo para pegar en WhatsApp');
        closeFeedbackModal();
      } catch (e) {
        showToast('ℹ️', 'Selecciona y copia el resumen del recuadro');
      }
      document.body.removeChild(temp);
    }

    let toastTimeout = null;
    function showToast(icon, message) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-text').textContent = message;
      banner.classList.remove('opacity-0');
      banner.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.remove('opacity-100');
        banner.classList.add('opacity-0');
      }, 2600);
    }

    // Escuchar escritura en comentario de feedback en tiempo real
    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'feedback-comment') {
        updateFeedbackPreview();
      }
    });

    // Inicializar app
    loadState();
    render();
  </script>
</body>
</html>
